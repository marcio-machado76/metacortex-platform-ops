# Empacotamento mínimo, para que o comando especificado em
# docs/01-comportamento.md — `inventario-vm` — exista de fato.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "inventario-vm"
version = "1.0.0"
description = "Inventário e drift de VM do parque da Metacortex, por SSH e somente leitura"
requires-python = ">=3.10"
dependencies = ["paramiko==3.5.1", "PyYAML==6.0.2"]

[project.scripts]
inventario-vm = "inventario_vm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
