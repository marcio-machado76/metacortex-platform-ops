[pytest]
testpaths = tests
pythonpath = src
# Verificação de "a suíte não toca a rede" (docs/03-divergencias-da-
# implementacao.md, "O que rodou"): rode com
#
#   pytest --disable-socket --allow-unix-socket
#
# O `--allow-unix-socket` é necessário a partir do grupo 7: os testes de
# tela chamam `asyncio.run()` para rodar a aplicação Textual em modo
# headless, e a própria `asyncio.new_event_loop()` do Python abre um
# socketpair AF_UNIX para o self-pipe interno do laço de eventos — IPC
# local do processo, não rede. Sem a flag, `--disable-socket` sozinho
# bloqueia essa abertura de laço de eventos antes de qualquer teste rodar,
# não porque algum teste tocou a rede; com a flag, uma conexão AF_INET de
# verdade continua bloqueada (conferido). Não é posto em `addopts` aqui
# porque isso tornaria `pytest-socket` uma dependência obrigatória até para
# rodar a suíte sem o bloqueio — e o projeto não fixa ferramenta de teste em
# `requirements.txt`, só dependência de execução (kubernetes, textual).
