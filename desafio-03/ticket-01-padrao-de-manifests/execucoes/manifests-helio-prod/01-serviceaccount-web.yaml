# 3.5 ServiceAccount dedicada, sem RBAC: requirements.txt do encontros-tech nao
# traz cliente de Kubernetes (nem 'kubernetes' nem equivalente) — a aplicacao nao
# fala com o apiserver. Ver DECISOES.md, decisao 4.
# 3.4 o token nao e montado, declarado aqui e no pod (o do pod e o que vale).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: helio-web
  namespace: helio-prod
  labels:
    app.kubernetes.io/name: helio-web
    app.kubernetes.io/instance: helio-prod
    app.kubernetes.io/part-of: helio
    app.kubernetes.io/managed-by: platform
  annotations:
    metacortex.io/owner: plataforma-sre
automountServiceAccountToken: false
