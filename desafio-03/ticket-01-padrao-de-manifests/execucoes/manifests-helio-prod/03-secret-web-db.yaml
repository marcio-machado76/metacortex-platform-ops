# 3.3 a URL inteira e credencial (usuario e senha embutidos: ver
# src/core/settings.py, DATABASE_URL). Por isso ela sai do ConfigMap e entra
# aqui inteira, nao decomposta em host/usuario/senha — a aplicacao nao le
# variaveis separadas, so DATABASE_URL. Ver DECISOES.md, decisao 6.
#
# ATENCAO — NAO E UMA SENHA REAL. E um placeholder para o formato do objeto.
# Antes de aplicar em helio-prod, o time que detem a credencial real do Postgres
# do cliente Helio precisa substituir o valor abaixo pelo pipeline de segredo da
# casa (sealed-secrets, vault, ou `kubectl create secret` manual fora do Git) —
# nunca commitando a senha real neste arquivo.
apiVersion: v1
kind: Secret
metadata:
  name: helio-web-db
  namespace: helio-prod
  labels:
    app.kubernetes.io/name: helio-web
    app.kubernetes.io/instance: helio-prod
    app.kubernetes.io/part-of: helio
    app.kubernetes.io/managed-by: platform
  annotations:
    metacortex.io/owner: plataforma-sre
type: Opaque
stringData:
  DATABASE_URL: "postgresql://CHANGEME:CHANGEME@CHANGEME:5432/CHANGEME"
