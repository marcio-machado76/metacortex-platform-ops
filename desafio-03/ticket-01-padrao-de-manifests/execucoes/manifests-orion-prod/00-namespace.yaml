# 1.2 namespace <cliente>-<ambiente>. 1.3 os quatro rotulos valem para todo objeto.
# Os rotulos pod-security nao vem do padrao: eles fazem o cluster RECUSAR na
# admissao o pod que violaria a 3.2. Ver DECISOES.md, decisao 6.
apiVersion: v1
kind: Namespace
metadata:
  name: orion-prod
  labels:
    app.kubernetes.io/name: orion-prod
    app.kubernetes.io/instance: orion-prod
    app.kubernetes.io/part-of: orion
    app.kubernetes.io/managed-by: platform
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
  annotations:
    metacortex.io/owner: plataforma-sre
