# fake-shop do cliente orion, ambiente de producao.
# Cada decisao que nao sai do padrao esta numerada em ../DECISOES.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion-web                      # 1.1 kebab-case
  namespace: orion-prod                # 1.2
  labels:                              # 1.3
    app.kubernetes.io/name: orion-web
    app.kubernetes.io/instance: orion-prod
    app.kubernetes.io/part-of: orion
    app.kubernetes.io/managed-by: platform
  annotations:                         # 1.5
    metacortex.io/owner: plataforma-sre
    metacortex.io/runbook: https://wiki.metacortex.io/runbooks/orion-web
spec:
  replicas: 2                          # 2.3 minimo em prod
  strategy:                            # 2.4
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    # 1.4 o seletor e imutavel apos a criacao, entao ele carrega so os dois
    # rotulos que nao mudam. managed-by fica fora: o proprio padrao lista tres
    # valores possiveis para ele, ou seja, a troca e prevista. Ver decisao 5.
    matchLabels:
      app.kubernetes.io/name: orion-web
      app.kubernetes.io/instance: orion-prod
  template:
    metadata:
      labels:                          # 1.3, e o par exato do seletor acima
        app.kubernetes.io/name: orion-web
        app.kubernetes.io/instance: orion-prod
        app.kubernetes.io/part-of: orion
        app.kubernetes.io/managed-by: platform
    spec:
      serviceAccountName: orion-web    # 3.5
      automountServiceAccountToken: false  # 3.4
      securityContext:
        # 3.2, parte de POD. Os tres campos abaixo so existem neste nivel.
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          # nao esta na regra 3.2, e sem ele o Pod Security restricted recusa
          # o pod na admissao. Ver decisao 7.
          type: RuntimeDefault
      containers:
        - name: web                    # 1.6 o componente, nao "app"
          # 3.1 tag imutavel · 3.7 registry do parque
          image: registry.metacortex.io/orion/web:v14
          ports:
            - name: http
              containerPort: 5000      # src/entrypoint.sh: gunicorn --bind 0.0.0.0:5000
          envFrom:
            - configMapRef:
                name: orion-web
          env:
            # 3.3 nada sensivel no manifesto: usuario e senha por referencia
            - name: DB_USER
              valueFrom:
                secretKeyRef: {name: orion-db, key: username}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: orion-db, key: password}
          # 2.2 as duas probes, apontando para endpoints que a aplicacao expoe
          # de fato. O fake-shop nao tem /health nem /ready; tem /metrics, que
          # nao toca o banco, e /, que toca. Ver decisao 1.
          startupProbe:
            # cobre a janela em que o entrypoint roda `flask db upgrade` antes
            # de o gunicorn escutar. Ver decisao 2.
            httpGet: {path: /metrics, port: http}
            periodSeconds: 5
            failureThreshold: 60       # ate 5 minutos de migracao
          livenessProbe:
            # "ainda estou vivo?" — sem o banco no caminho, senao banco lento
            # vira reinicio, e reinicio nao conserta banco
            httpGet: {path: /metrics, port: http}
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            # "posso receber trafego?" — para uma loja isso inclui o banco,
            # e a raiz renderiza o catalogo
            httpGet: {path: /, port: http}
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            # 2.1 presenca e obrigatoria; o valor e estimativa declarada.
            # Flask + gunicorn com 1 worker por replica. Ver decisao 3.
            requests: {cpu: 100m, memory: 192Mi}
            limits:   {cpu: 500m, memory: 384Mi}
          securityContext:
            # 3.2, parte de CONTAINER. Estes tres nao existem em PodSecurityContext.
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # readOnlyRootFilesystem obriga a dar caminho gravavel para o que a
            # aplicacao escreve. Sao dois, e nenhum aparece no YAML de origem:
            # o gunicorn usa /tmp para arquivo temporario de worker, e o
            # GunicornPrometheusMetrics escreve em PROMETHEUS_MULTIPROC_DIR.
            - {name: tmp, mountPath: /tmp}
            - {name: metricas, mountPath: /tmp/metrics}
      volumes:
        - {name: tmp, emptyDir: {}}
        - {name: metricas, emptyDir: {}}
      terminationGracePeriodSeconds: 30   # 2.6 padrao mantido — ver decisao 8
