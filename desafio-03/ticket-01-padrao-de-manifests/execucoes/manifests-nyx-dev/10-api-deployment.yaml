# kube-news do cliente nyx, ambiente de desenvolvimento.
# Cada decisao que nao sai direto do padrao esta numerada em ./DECISOES.md.
#
# Este conjunto exercita MENOS regras que o do orion-prod, e isso e efeito do
# ambiente, nao descuido: 2.3, 2.4 e 2.5 sao regras de prod. Ver decisao 1.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nyx-api                        # 1.1 kebab-case
  namespace: nyx-dev                   # 1.2
  labels:                              # 1.3
    app.kubernetes.io/name: nyx-api
    app.kubernetes.io/instance: nyx-dev
    app.kubernetes.io/part-of: nyx
    app.kubernetes.io/managed-by: platform
  annotations:                         # 1.5
    metacortex.io/owner: plataforma-sre
    metacortex.io/runbook: https://wiki.metacortex.io/runbooks/nyx-api
spec:
  # 2.3 exige >= 2 apenas em prod; em dev uma replica e aceitavel pelo texto
  # da propria regra. Ver decisao 1.
  replicas: 1
  # 2.4 e "obrigatorio em prod". Em dev fica o RollingUpdate padrao do
  # Kubernetes, sem bloco declarado. Ver decisao 1.
  selector:
    # 1.4 o seletor e imutavel apos a criacao, entao carrega so os dois
    # rotulos que nao mudam. managed-by fica fora: o padrao lista tres valores
    # possiveis para ele, ou seja, a troca e prevista.
    matchLabels:
      app.kubernetes.io/name: nyx-api
      app.kubernetes.io/instance: nyx-dev
  template:
    metadata:
      labels:                          # 1.3, e o par exato do seletor acima
        app.kubernetes.io/name: nyx-api
        app.kubernetes.io/instance: nyx-dev
        app.kubernetes.io/part-of: nyx
        app.kubernetes.io/managed-by: platform
    spec:
      serviceAccountName: nyx-api      # 3.5
      automountServiceAccountToken: false  # 3.4
      securityContext:
        # 3.2, parte de POD.
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          # nao esta na regra 3.2, e sem ele o Pod Security restricted recusa
          # o pod na admissao.
          type: RuntimeDefault
      containers:
        - name: api                    # 1.6 o componente, nao "app"
          # 3.1 tag imutavel · 3.7 registry do parque
          image: registry.metacortex.io/nyx/api:2.9.1
          ports:
            - name: http
              # src/server.js: app.listen(8080), numero fixo no codigo. A
              # aplicacao NAO le porta de variavel de ambiente. Decisao 7.
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: nyx-api
          env:
            # 3.3 nada sensivel no manifesto: usuario e senha por referencia
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef: {name: nyx-db, key: username}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: nyx-db, key: password}
          # 2.2 as duas probes, apontando para endpoints que a aplicacao expoe
          # de fato — e a escolha aqui contraria o que o nome dos endpoints
          # sugere. Ver decisao 2, que e a decisao mais importante do conjunto.
          startupProbe:
            # cobre a janela do seque.sync({alter: true}), que roda concorrente
            # ao app.listen e nao e aguardado. Ver decisao 3.
            httpGet: {path: /, port: http}
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            # "ainda estou vivo?" — /health so devolve os.hostname(), nao toca
            # o banco. Banco lento nao pode virar reinicio.
            httpGet: {path: /health, port: http}
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            # "posso receber trafego?" — a raiz faz Post.findAll(), entao
            # exercita o banco. NAO usamos /ready: ele existe, mas nao checa
            # nada. Ver decisao 2.
            httpGet: {path: /, port: http}
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            # 2.1 presenca e obrigatoria; o valor e estimativa declarada.
            # Node 16 em processo unico por replica. Ver decisao 5.
            requests: {cpu: 100m, memory: 128Mi}
            limits:   {cpu: 500m, memory: 256Mi}
          securityContext:
            # 3.2, parte de CONTAINER.
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Sem volumeMounts, e isso e uma afirmacao sobre o projeto, nao
          # esquecimento: nao ha escrita em disco. Diferente do fake-shop, que
          # precisou de dois emptyDir. Ver decisao 6.
      terminationGracePeriodSeconds: 30   # 2.6 padrao mantido — ver decisao 9
