apiVersion: v1
kind: Service
metadata:
  name: nyx-api
  namespace: nyx-dev
  labels:
    app.kubernetes.io/name: nyx-api
    app.kubernetes.io/instance: nyx-dev
    app.kubernetes.io/part-of: nyx
    app.kubernetes.io/managed-by: platform
  annotations:
    metacortex.io/owner: plataforma-sre
spec:
  type: ClusterIP
  # 1.4 identico ao matchLabels do Deployment e aos rotulos do pod.
  # E aqui que o erro mais silencioso do parque acontece — e e exatamente o
  # Chamado 3 do Ticket 02, que vive no namespace vizinho nyx-stg.
  selector:
    app.kubernetes.io/name: nyx-api
    app.kubernetes.io/instance: nyx-dev
  ports:
    - name: http
      port: 80          # o Service publica 80
      targetPort: http  # e encaminha para a 8080 do container, por nome
