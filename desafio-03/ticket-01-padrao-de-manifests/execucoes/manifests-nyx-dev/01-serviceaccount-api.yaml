# 3.5 ServiceAccount dedicada, sem RBAC: o kube-news nao fala com o apiserver.
# 3.4 o token nao e montado. A checagem esta em DECISOES.md, decisao 4.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nyx-api
  namespace: nyx-dev
  labels:
    app.kubernetes.io/name: nyx-api
    app.kubernetes.io/instance: nyx-dev
