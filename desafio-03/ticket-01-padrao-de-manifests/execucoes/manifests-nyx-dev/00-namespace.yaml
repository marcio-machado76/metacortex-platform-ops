# 1.2 namespace <cliente>-<ambiente>. 1.3 os quatro rotulos valem para todo objeto.
# Os rotulos pod-security nao vem do padrao: eles fazem o cluster RECUSAR na
# admissao o pod que violaria a 3.2.
apiVersion: v1
kind: Namespace
metadata:
  name: nyx-dev
  labels:
    app.kubernetes.io/name: nyx-dev
    app.kubernetes.io/instance: nyx-dev
    app.kubernetes.io/part-of: nyx
    app.kubernetes.io/managed-by: platform
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
  annotations:
    metacortex.io/owner: plataforma-sre
